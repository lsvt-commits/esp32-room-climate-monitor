name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-data:
    name: Node.js / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - name: Python bridge syntax
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('tools/serial-bridge.py').read_text())"
